
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Axios Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Post Manager</h1>
    <p>Learning Axios Requests</p>
  </header>

  <main>
    <h2>Create a Post</h2>

    <form id="postForm">
      <input type="text" id="title" placeholder="Post Title" required>
      <textarea id="body" placeholder="Write your post..." required></textarea>
      <button type="submit">Send Post</button>
    </form>

    <p id="postMessage"></p>

    <h2>Update a Post</h2>
    <button id="updateBtn">Update Post #1</button>
    <p id="updateMessage"></p>

    <h2>Delete a Post</h2>
    <button id="deleteBtn">Delete Post #1</button>
    <p id="deleteMessage"></p>

    <h2>All Posts</h2>
    <p id="getMessage"></p>
    <div id="posts"></div>
  </main>

  <footer>
    <p>© 2026 My Axios Project</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
