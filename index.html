
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post Space | Axios Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h2>POST SPACE</h2>
    <p>My Post Manager</p>
  </header>

  <main>
    <section class="intro">
      <h1>Share Your Thoughts</h1>
      <p>Create, update, delete and explore posts using Axios.</p>
    </section>

    <!-- POST REQUEST -->
    <section class="form-section">
      <h2>Create a New Post</h2>

      <form id="postForm">
        <label for="postTitle">Post Title</label>
        <input
          type="text"
          id="postTitle"
          placeholder="What's on your mind?"
          required
        >

        <label for="postBody">Your Message</label>
        <textarea
          id="postBody"
          placeholder="Write your post here..."
          required
        ></textarea>

        <button type="submit" id="sendBtn">
          Send Post
        </button>
      </form>

      <p id="postMessage" class="message" role="status"></p>
    </section>

    <!-- PATCH AND DELETE REQUESTS -->
    <section class="actions">
      <div class="action-card">
        <h2>Update Post</h2>
        <p>Update the title of post #1.</p>
        <button id="patchBtn">PATCH Post</button>
        <p id="patchMessage" class="message" role="status"></p>
      </div>

      <div class="action-card">
        <h2>Delete Post</h2>
        <p>Delete post #1.</p>
        <button id="deleteBtn">DELETE Post</button>
        <p id="deleteMessage" class="message" role="status"></p>
      </div>
    </section>

    <!-- GET REQUEST -->
    <section class="posts-section">
      <h2>Explore Posts</h2>
      <p>Posts loaded automatically from the API.</p>

      <p id="getMessage" class="message" role="status"></p>

      <div id="postsContainer"></div>
    </section>
  </main>

  <footer>
    <p>© 2026 Post Space | Axios Assignment</p>
  </footer>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
